name: Sync Google Calendar

on:
  repository_dispatch:
    types: [calendar-updated]
  workflow_dispatch: {}

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OPENMS_GITHUB_APP_ID }}
          private-key: ${{ secrets.OPENMS_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml icalendar

      - name: Run calendar sync script
        env:
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
        run: python sync_google_calendar.py

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- data/community_events.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push directly to main
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/community_events.yaml
          git commit -m "Sync events from Google Calendar"
          git push origin main
