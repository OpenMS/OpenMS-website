{{- $formId := .formId | default "44qqqd" -}}
{{- $title := .title | default "OpenMS Fellowship Application" -}}
<div class="fellowship-page__form-body" aria-label="{{ $title }}">
  <iframe
    class="fellowship-page__tally-iframe"
    data-tally-src="https://tally.so/embed/{{ $formId }}?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
    loading="eager"
    width="100%"
    height="960"
    frameborder="0"
    marginheight="0"
    marginwidth="0"
    scrolling="no"
    title="{{ $title }}"
  ></iframe>
</div>
<script async src="https://tally.so/widgets/embed.js"></script>
<script>
(function () {
  /* Soft floors only before Tally reports real height — avoid a tall empty band */
  var MOBILE_MIN = 900;
  var DESKTOP_MIN = 800;

  function floorHeight() {
    return window.matchMedia("(max-width: 720px)").matches ? MOBILE_MIN : DESKTOP_MIN;
  }

  function applyFloor(iframe) {
    if (!iframe) return;
    var min = floorHeight();
    var styleH = parseInt(iframe.style.height, 10) || 0;
    var attrH = parseInt(iframe.getAttribute("height"), 10) || 0;
    /* Prefer Tally’s measured height when present; otherwise keep a soft floor */
    var next = styleH > 0 ? styleH : Math.max(min, attrH);
    if (next < min) next = min;
    iframe.style.minHeight = "0px";
    iframe.style.height = next + "px";
    iframe.setAttribute("height", String(next));
  }

  var fallbackTimer = null;

  function loadTallyEmbeds() {
    if (typeof window.Tally !== "undefined") {
      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
      window.Tally.loadEmbeds();
    } else if (!fallbackTimer) {
      /* Tally's embed.js isn't ready yet. Setting the iframe src ourselves
         would skip its resize handshake, so the iframe would stay at the
         floor height and cut off the bottom of the form. Wait for the script;
         only if it never arrives, load the plain iframe as a last resort. */
      fallbackTimer = setTimeout(function () {
        if (typeof window.Tally === "undefined") {
          document.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function (iframe) {
            iframe.src = iframe.dataset.tallySrc;
          });
        }
      }, 6000);
    }

    document.querySelectorAll(".fellowship-page__tally-iframe").forEach(applyFloor);
  }

  var tallyScript = document.querySelector('script[src*="tally.so/widgets/embed.js"]');
  if (tallyScript) {
    tallyScript.addEventListener("load", loadTallyEmbeds);
  }

  window.addEventListener("message", function (event) {
    if (typeof event.data !== "string" || event.data.indexOf("Tally.resizeForm") !== 0) {
      if (!event.data || event.data.type !== "tally.resizeForm") return;
    }
    document.querySelectorAll(".fellowship-page__tally-iframe").forEach(function (iframe) {
      window.requestAnimationFrame(function () {
        applyFloor(iframe);
      });
    });
  });

  window.addEventListener("resize", function () {
    document.querySelectorAll(".fellowship-page__tally-iframe").forEach(applyFloor);
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadTallyEmbeds);
  } else {
    loadTallyEmbeds();
  }
  window.addEventListener("load", loadTallyEmbeds);
})();
</script>
