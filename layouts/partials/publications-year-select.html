<div class="publications-toolbar">
  <label class="publications-toolbar__filter" for="publications-year-select">
    <span class="publications-toolbar__label" id="publications-year-label"><i class="far fa-calendar-alt" aria-hidden="true"></i>Year</span>
    <span class="publications-toolbar__control">
      <select
        id="publications-year-select"
        class="publications-toolbar__select"
        data-publications-year-select
        aria-labelledby="publications-year-label"
      ></select>
      <i class="fas fa-chevron-down publications-toolbar__chevron" aria-hidden="true"></i>
    </span>
  </label>
  <nav class="publications-year-nav" data-publications-year-nav aria-label="Filter by year" hidden></nav>
</div>
