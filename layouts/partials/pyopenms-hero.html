{{- /*
  pyOpenMS solution hero — kept in a partial so HTML is not
  mistreated as a Markdown indented code block.
*/ -}}
<header class="openms-lib-hero openms-lib-hero--pro openms-lib-hero--solution" aria-label="pyOpenMS Python bindings">
  <div class="openms-lib-hero__panel">
    <div class="openms-lib-hero__content">
      <p class="openms-lib-hero__eyebrow">pyOpenMS</p>
      <h1 class="openms-lib-hero__title">
        Python bindings for <span class="openms-lib-hero__accent openms-lib-hero__accent--warm">mass spectrometry</span>.
      </h1>
      <p class="openms-lib-hero__lead">
        Python bindings to OpenMS-lib. Write custom analysis scripts and integrate OpenMS into Python workflows.
      </p>
      <div class="openms-lib-hero__actions" aria-label="Install pyOpenMS">
        <a
          class="openms-lib-btn openms-lib-btn--primary openms-lib-btn--install"
          href="https://pypi.org/project/pyopenms/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="openms-lib-btn__label">Install</span>
          <span class="openms-lib-btn__platforms" aria-label="Python package index">
            <i class="fab fa-python" aria-hidden="true"></i>
          </span>
        </a>
        <a
          class="openms-lib-btn openms-lib-btn--ghost"
          href="https://pyopenms.readthedocs.io/en/latest/user_guide/installation.html"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fas fa-book-open" aria-hidden="true"></i>
          <span class="openms-lib-btn__label">Install guide</span>
        </a>
      </div>
    </div>
  </div>
</header>
