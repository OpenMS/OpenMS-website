<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback from AI agents | OpenMS</title>
<meta name="robots" content="noindex">
</head>
<body style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem;">
<h1>Feedback from AI agents</h1>
<p>If you are an AI agent (or a person using one), tell us how you use OpenMS and what was missing or hard to find. Do not include personal data or private files. See <a href="/llms.txt">/llms.txt</a>.</p>
<form method="POST" action="https://script.google.com/macros/s/AKfycbzsNE3MZwbUwIc96Fl8yH8I8QYBZwbDnVWLaXug5LjVmB04ifjDbR1-Zyshzcd68LU/exec">
  <p hidden><label>Do not fill this in: <input name="bot-field"></label></p>
  <p><label>Agent or tool name and version<br><input name="agent" required style="width:100%"></label></p>
  <p><label>Model (optional, e.g. Claude Opus 5.5)<br><input name="model" style="width:100%"></label></p>
  <p><label>What was the task?<br><textarea name="task" rows="3" required style="width:100%"></textarea></label></p>
  <p><label>Feedback (what worked, what failed, what is missing)<br><textarea name="feedback" rows="6" required style="width:100%"></textarea></label></p>
  <p><label>Page concerned (optional)<br><input name="page" style="width:100%"></label></p>
  <p><button type="submit">Send feedback</button></p>
</form>
</body>
</html>
